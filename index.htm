<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>College Study Planner</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Your CSS -->
<link rel="stylesheet" href="style2.css">

<style>
body{
    background:linear-gradient(135deg,#4e73df,#1cc88a);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-card{
    width:450px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{
    font-size:28px;
    font-weight:bold;
}

.eye-btn{
    cursor:pointer;
}
</style>
</head>
<body>
<div class="card login-card p-4">
<div class="text-center">
<i class="bi bi-mortarboard-fill text-primary" style="font-size:60px;"></i>

<h1 class="mt-2">College Study Planner</h1>

<p class="text-muted">Student Login Portal</p>

</div>

<form onsubmit="return validateForm()" action="home.html">

<div class="mb-3">
<label class="form-label">Username</label>
<input type="text" class="form-control" id="name" placeholder="Enter Username">
</div>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" id="email" placeholder="Enter Email">
</div>

<div class="mb-3">
<label class="form-label">Mobile Number</label>
<input type="text" class="form-control" id="mobile" placeholder="Enter Mobile Number">
</div>

<div class="mb-3">

<label class="form-label">Password</label>

<div class="input-group">

<input type="password" class="form-control" id="password" placeholder="Enter Password">

<span class="input-group-text eye-btn" onclick="togglePassword()">
<i class="bi bi-eye-fill" id="eyeIcon"></i>
</span>
</div>
</div>
<div class="mb-3">

<label class="form-label">Branch</label>

<select class="form-select" required>

<option value="">Select Branch</option>

<option>Computer Science and Engineering</option>

<option>Information Technology</option>

<option>Electronics Engineering</option>

<option>Mechanical Engineering</option>

<option>Civil Engineering</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">Year</label>

<select class="form-select" required>

<option value="">Select Year</option>

<option>First Year</option>

<option>Second Year</option>

<option>Third Year</option>

<option>Fourth Year</option>

</select>

</div>

<div class="d-flex justify-content-between mb-3">

<div class="form-check">

<input class="form-check-input" type="checkbox">

<label class="form-check-label">

Remember Me

</label>

</div>

<a href="#" class="text-decoration-none">Forgot Password?</a>

</div>

<div class="d-grid">

<button class="btn btn-primary btn-lg">

<i class="bi bi-box-arrow-in-right"></i>

Login

</button>

</div>

</form>

</div>

<script>

function validateForm(){

let name=document.getElementById("name").value.trim();

let email=document.getElementById("email").value.trim();

let mobile=document.getElementById("mobile").value.trim();

let password=document.getElementById("password").value;

if(name==""){

alert("Username is required");

return false;

}

if(!email.includes("@")){

alert("Enter a valid email");

return false;

}

if(mobile.length!=10 || isNaN(mobile)){

alert("Enter valid 10 digit mobile number");

return false;

}

if(password.length<6){

alert("Password should contain at least 6 characters");

return false;

}

alert("Login Successful!");

return true;

}

function togglePassword(){

let pass=document.getElementById("password");

let eye=document.getElementById("eyeIcon");

if(pass.type==="password"){

pass.type="text";

eye.className="bi bi-eye-slash-fill";

}

else{

pass.type="password";

eye.className="bi bi-eye-fill";

}

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
